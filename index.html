<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSearchVN - Tìm Kiếm Đa Năng</title>
    <!-- Thêm thư viện SortableJS cho tính năng Kéo thả -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            padding: 20px;
            transition: background-color 0.3s ease;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: -2px;
            text-align: center;
            user-select: none;
        }

        @media (max-width: 600px) {
            .logo { font-size: 2.5rem; }
        }

        .search-box {
            width: 100%;
            max-width: 650px;
            position: relative;
            margin-bottom: 10px;
        }

        /* Style cho lịch sử tìm kiếm */
        .history-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            justify-content: center;
            align-items: center;
        }
        .history-item {
            background-color: #f1f3f4;
            color: #5f6368;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #dadce0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .history-item:hover { background-color: #e8eaed; }
        body.dark-mode .history-item { background-color: #303134; color: #e8eaed; border-color: #5f6368; }
        body.dark-mode .history-item:hover { background-color: #3c4043; }

        .history-close {
            font-size: 14px;
            color: #9aa0a6;
            font-weight: bold;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .history-close:hover {
            color: #ffffff;
            background-color: #EA4335;
        }

        .history-clear {
            background-color: transparent;
            border: 1px solid #dadce0;
            color: #5f6368;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
        }
        .history-clear:hover {
            background-color: #f1f3f4;
            color: #EA4335;
            border-color: #EA4335;
        }
        body.dark-mode .history-clear {
            background-color: #303134;
            color: #e8eaed;
            border-color: #5f6368;
        }
        body.dark-mode .history-clear:hover {
            background-color: #3c4043;
            color: #EA4335;
            border-color: #EA4335;
        }

        .search-input {
            width: 100%;
            padding: 14px 50px 14px 50px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:hover, .search-input:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
            border-color: rgba(223,225,229,0);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #9aa0a6;
            font-size: 18px;
        }

        .voice-btn {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #9aa0a6;
            outline: none;
        }
        .voice-btn:hover { color: #4285F4; }
        body.dark-mode .voice-btn { color: #9aa0a6; }
        body.dark-mode .voice-btn:hover { color: #8ab4f8; }

        .search-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 850px;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 20px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 20px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn:hover {
            background-color: #f1f3f4;
            border-color: #bcc1c6;
            box-shadow: 0 1px 3px rgba(0,0,0,.1);
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background-color: #f1f3f4;
            border-color: #bcc1c6;
            box-shadow: 0 1px 3px rgba(0,0,0,.1);
        }

        body.dark-mode {
            background-color: #202124;
            color: #e8eaed;
        }

        body.dark-mode .search-input {
            background-color: #303134;
            color: #ffffff;
            border-color: #5f6368;
        }

        body.dark-mode .btn {
            background-color: #303134;
            color: #e8eaed;
            border-color: #5f6368;
        }

        body.dark-mode .btn:hover {
            background-color: #3c4043;
        }

        body.dark-mode .theme-toggle {
            background-color: #303134;
            border-color: #5f6368;
            color: #ffffff;
        }

        body.dark-mode .theme-toggle:hover {
            background-color: #3c4043;
        }

        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        body.dark-mode .auth-card {
            background: #303134;
            color: #e8eaed;
        }

        .auth-card h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .auth-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dfe1e5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        body.dark-mode .auth-input {
            background-color: #202124;
            color: #fff;
            border-color: #5f6368;
        }

        .password-container {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .password-container .auth-input {
            margin-bottom: 0;
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #9aa0a6;
        }

        .auth-input-user {
            margin-bottom: 15px;
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .auth-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-login {
            background-color: #1a0dab;
            color: #fff;
            border-color: #1a0dab;
        }

        .btn-register {
            background-color: #f8f9fa;
            color: #3c4043;
        }

        body.dark-mode .btn-register {
            background-color: #202124;
            color: #e8eaed;
            border-color: #5f6368;
        }

        .btn-guest {
            width: 100%;
            background-color: #f8f9fa;
            color: #3c4043;
            padding: 10px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        body.dark-mode .btn-guest {
            background-color: #202124;
            color: #e8eaed;
            border-color: #5f6368;
        }

        .auth-error {
            color: #EA4335;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }

        .user-info {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logout-btn {
            background: none;
            border: none;
            color: #EA4335;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="userInfo" class="user-info" style="display: none;">
        <span>Chào, <strong id="currentUsername"></strong></span>
        <button class="logout-btn" onclick="logout()">Đăng xuất</button>
    </div>

    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <h2>Đăng Nhập / Đăng Ký</h2>
            <div id="authError" class="auth-error"></div>
            <input type="text" id="authUsername" class="auth-input auth-input-user" placeholder="Nhập tên người dùng...">
            
            <div class="password-container">
                <input type="password" id="authPassword" class="auth-input" placeholder="Nhập mật khẩu...">
                <button type="button" id="togglePassBtn" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
            </div>

            <div class="auth-buttons">
                <button class="auth-btn btn-login" onclick="handleLogin()">Đăng Nhập</button>
                <button class="auth-btn btn-register" onclick="handleRegister()">Đăng Ký</button>
            </div>
            <button class="auth-btn btn-guest" onclick="handleGuestLogin()">Dùng tài khoản khách</button>
        </div>
    </div>

    <!-- Modal thông báo đang nghe giọng nói có thêm nút Thoát -->
    <div id="voiceOverlay" class="auth-overlay" style="display: none;">
        <div class="auth-card" style="max-width: 320px; text-align: center;">
            <div style="font-size: 40px; margin-bottom: 15px;">🎤</div>
            <h3 style="font-size: 18px; margin-bottom: 10px;">tôi đang nghe đây!</h3>
            <p id="voiceTranscript" style="font-size: 14px; color: #5f6368; min-height: 20px; margin-bottom: 15px;"></p>
            <button class="btn" onclick="closeVoiceSearch()" style="width: 100%;">Thoát</button>
        </div>
    </div>

    <button id="themeToggleBtn" class="theme-toggle" onclick="toggleTheme()" title="Chuyển đổi giao diện Sáng/Tối">🌙</button>
    <button id="settingsToggleBtn" class="theme-toggle" style="right: 70px;" onclick="toggleSettings()" title="Cài đặt hình nền & Nút">⚙️</button>

    <!-- Modal Cài đặt hình nền, công cụ mặc định và quản lý nút -->
    <div id="settingsOverlay" class="auth-overlay" style="display: none;">
        <div class="auth-card" style="max-width: 450px; text-align: left; max-height: 90vh; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0; font-size: 20px;">Cài đặt</h2>
                <button onclick="toggleSettings()" style="background: none; border: none; font-size: 18px; cursor: pointer; color: inherit;">✕</button>
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px;">Hình nền trang web:</label>
                <input type="file" id="bgImageInput" accept="image/*" class="auth-input" style="padding: 8px;" onchange="handleBgUpload(event)">
                <button class="btn" style="margin-top: 8px; width: 100%;" onclick="removeBgImage()">Xóa hình nền</button>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px;">Công cụ tìm kiếm mặc định (khi nhấn Enter):</label>
                <select id="defaultEngineSelect" class="auth-input" style="padding: 10px;" onchange="changeDefaultEngine(event)"></select>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px;">Thêm công cụ tìm kiếm mới:</label>
                <input type="text" id="customBtnName" class="auth-input" placeholder="Tên công cụ..." style="margin-bottom: 8px;">
                <input type="text" id="customBtnUrl" class="auth-input" placeholder="Đường dẫn (VD: https://...)..." style="margin-bottom: 8px;">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                    <label style="font-size: 13px;">Màu sắc:</label>
                    <input type="color" id="customBtnColor" value="#3c4043" style="border: none; width: 40px; height: 30px; cursor: pointer; background: none;">
                </div>
                <button class="btn btn-login" style="width: 100%;" onclick="addSearchEngine()">Thêm công cụ</button>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px;">Quản lý công cụ (Xóa):</label>
                <div id="enginesListContainer" style="max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;"></div>
            </div>

            <div>
                <button class="btn" style="width: 100%; background-color: #EA4335; color: #fff; border-color: #EA4335;" onclick="factoryReset()">Khôi phục cài đặt gốc</button>
            </div>
        </div>
    </div>

    <div class="logo">
        <span style="color:#4285F4;">U</span><span style="color:#EA4335;">n</span><span style="color:#FBBC05;">i</span><span style="color:#4285F4;">S</span><span style="color:#34A853;">e</span><span style="color:#EA4335;">a</span><span style="color:#4285F4;">r</span><span style="color:#34A853;">c</span><span style="color:#EA4335;">h</span><span style="color:#4285F4;">V</span><span style="color:#34A853;">N</span>
    </div>

    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Nhập từ khóa hoặc chọn nền tảng bên dưới..." autofocus>
        <button type="button" id="voiceBtn" class="voice-btn" onclick="toggleVoiceSearch()" title="Tìm kiếm bằng giọng nói">🎤</button>
    </div>

    <!-- Vùng hiển thị lịch sử -->
    <div id="historyContainer" class="history-container"></div>

    <!-- Vùng chứa các nút công cụ tìm kiếm (có thể kéo thả, thêm, xóa) -->
    <div class="search-buttons" id="searchButtonsContainer"></div>

    <script>
        const defaultEngines = [
            { id: 'google', name: 'Google', color: '#1a0dab', borderColor: '#4285F4', type: 'builtin', url: 'https://www.google.com/search?q=' },
            { id: 'bing', name: 'Bing', color: '#0078d4', borderColor: '#0078d4', type: 'builtin', url: 'https://www.bing.com/search?q=' },
            { id: 'coccoc', name: 'Cốc Cốc', color: '#008f5d', borderColor: '#008f5d', type: 'builtin', url: 'https://coccoc.com/search?q=' },
            { id: 'yahoo', name: 'Yahoo!', color: '#6001d2', borderColor: '#6001d2', type: 'builtin', url: 'https://vn.search.yahoo.com/search?p=' },
            { id: 'duckduckgo', name: 'DuckDuckGo', color: '#de5833', borderColor: '#de5833', type: 'builtin', url: 'https://duckduckgo.com/?q=' },
            { id: 'startpage', name: 'Startpage', color: '#3b5998', borderColor: '#3b5998', type: 'builtin', url: 'https://www.startpage.com/do/search?q=' },
            { id: 'youtube', name: 'YouTube', color: '#ff0000', borderColor: '#ff0000', type: 'builtin', url: 'https://www.youtube.com/results?search_query=' },
            { id: 'tiktok', name: 'TikTok', color: '#010101', borderColor: '#010101', type: 'builtin', url: 'https://www.tiktok.com/search?q=' },
            { id: 'facebook', name: 'Facebook', color: '#1877f2', borderColor: '#1877f2', type: 'builtin', url: 'https://www.facebook.com/search/top?q=' },
            { id: 'gemini', name: 'Gemini', color: '#4285F4', borderColor: '#4285F4', type: 'builtin', url: 'https://gemini.google.com' },
            { id: 'chatgpt', name: 'ChatGPT', color: '#10a37f', borderColor: '#10a37f', type: 'builtin', url: 'https://chatgpt.com' }
        ];

        function getEngines() {
            const stored = localStorage.getItem('searchEngines');
            if (stored) {
                try { return JSON.parse(stored); } catch (e) {}
            }
            return JSON.parse(JSON.stringify(defaultEngines));
        }

        window.addEventListener('DOMContentLoaded', () => {
            const loggedUser = localStorage.getItem('currentUser');
            if (loggedUser) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('userInfo').style.display = 'flex';
                document.getElementById('currentUsername').textContent = loggedUser;
            }

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeToggleBtn').textContent = '☀️';
            }

            const savedBg = localStorage.getItem('bgImage');
            if (savedBg) {
                applyBackgroundImage(savedBg);
            }
            
            renderHistory();
            renderSearchButtons();
            renderDefaultEngineSelect();
            renderSettingsEnginesList();
        });

        function handleBgUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                localStorage.setItem('bgImage', dataUrl);
                applyBackgroundImage(dataUrl);
            };
            reader.readAsDataURL(file);
        }

        function applyBackgroundImage(url) {
            if (url) {
                document.body.style.backgroundImage = `url(${url})`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundRepeat = 'no-repeat';
                document.body.style.backgroundAttachment = 'fixed';
            } else {
                document.body.style.backgroundImage = 'none';
            }
        }

        function removeBgImage() {
            localStorage.removeItem('bgImage');
            applyBackgroundImage(null);
            document.getElementById('bgImageInput').value = '';
        }

        function toggleSettings() {
            const overlay = document.getElementById('settingsOverlay');
            overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
            if (overlay.style.display === 'flex') {
                renderDefaultEngineSelect();
                renderSettingsEnginesList();
            }
        }

        function changeDefaultEngine(event) {
            localStorage.setItem('defaultEngine', event.target.value);
        }

        function renderDefaultEngineSelect() {
            const select = document.getElementById('defaultEngineSelect');
            const engines = getEngines();
            const currentDefault = localStorage.getItem('defaultEngine') || 'google';
            const allowedDefaultIds = ['google', 'coccoc', 'bing', 'yahoo', 'duckduckgo', 'startpage'];
            
            select.innerHTML = '';
            engines.filter(engine => allowedDefaultIds.includes(engine.id)).forEach(engine => {
                const option = document.createElement('option');
                option.value = engine.id;
                option.textContent = engine.name;
                if (engine.id === currentDefault) {
                    option.selected = true;
                }
                select.appendChild(option);
            });
        }

        function addSearchEngine() {
            const name = document.getElementById('customBtnName').value.trim();
            const url = document.getElementById('customBtnUrl').value.trim();
            const color = document.getElementById('customBtnColor').value;

            if (!name || !url) {
                alert('Vui lòng nhập đầy đủ tên và đường dẫn!');
                return;
            }

            let engines = getEngines();
            const newId = 'engine_' + Date.now();
            engines.push({
                id: newId,
                name: name,
                color: color,
                borderColor: color,
                type: 'custom',
                url: url
            });
            localStorage.setItem('searchEngines', JSON.stringify(engines));

            document.getElementById('customBtnName').value = '';
            document.getElementById('customBtnUrl').value = '';
            renderSearchButtons();
            renderDefaultEngineSelect();
            renderSettingsEnginesList();
        }

        function removeSearchEngine(id) {
            let engines = getEngines();
            engines = engines.filter(e => e.id !== id);
            localStorage.setItem('searchEngines', JSON.stringify(engines));

            const defaultEng = localStorage.getItem('defaultEngine');
            if (defaultEng === id) {
                localStorage.setItem('defaultEngine', 'google');
            }

            renderSearchButtons();
            renderDefaultEngineSelect();
            renderSettingsEnginesList();
        }

        let searchButtonsSortable = null;

        function renderSearchButtons() {
            const container = document.getElementById('searchButtonsContainer');
            const engines = getEngines();
            container.innerHTML = '';

            engines.forEach(engine => {
                const buttonEl = document.createElement('button');
                buttonEl.className = 'btn';
                buttonEl.style.color = engine.color;
                buttonEl.style.borderColor = engine.borderColor || engine.color;
                buttonEl.textContent = engine.name;
                buttonEl.setAttribute('data-id', engine.id);
                buttonEl.onclick = () => performSearch(engine.id);
                container.appendChild(buttonEl);
            });

            if (searchButtonsSortable) {
                searchButtonsSortable.destroy();
            }
            searchButtonsSortable = new Sortable(container, {
                animation: 150,
                onEnd: function () {
                    const buttons = container.children;
                    let engines = getEngines();
                    let newEngines = [];
                    for (let i = 0; i < buttons.length; i++) {
                        const id = buttons[i].getAttribute('data-id');
                        const found = engines.find(e => e.id === id);
                        if (found) newEngines.push(found);
                    }
                    localStorage.setItem('searchEngines', JSON.stringify(newEngines));
                    renderDefaultEngineSelect();
                    renderSettingsEnginesList();
                }
            });
        }

        function renderSettingsEnginesList() {
            const listContainer = document.getElementById('enginesListContainer');
            const engines = getEngines();
            listContainer.innerHTML = '';

            if (engines.length === 0) {
                listContainer.innerHTML = '<span style="font-size: 12px; color: #9aa0a6;">Không có công cụ nào.</span>';
                return;
            }

            engines.forEach(engine => {
                const itemEl = document.createElement('div');
                itemEl.style.display = 'flex';
                itemEl.style.justifyContent = 'space-between';
                itemEl.style.alignItems = 'center';
                itemEl.style.padding = '4px 8px';
                itemEl.style.backgroundColor = 'rgba(0,0,0,0.03)';
                itemEl.style.borderRadius = '4px';
                itemEl.style.fontSize = '13px';

                itemEl.innerHTML = `
                    <span style="color: ${engine.color}; font-weight: bold;">${engine.name}</span>
                    <button onclick="removeSearchEngine('${engine.id}')" style="background: none; border: none; color: #EA4335; cursor: pointer; font-weight: bold;">Xóa</button>
                `;
                listContainer.appendChild(itemEl);
            });
        }

        function factoryReset() {
            if (confirm('Bạn có chắc chắn muốn khôi phục cài đặt gốc không? Mọi tùy chỉnh, lịch sử và cài đặt sẽ bị xóa.')) {
                localStorage.clear();
                location.reload();
            }
        }

        // Tính năng Voice Search tự động ngắt câu và tìm kiếm không cần bấm nút thoát
        let recognition = null;
        let isListening = false;
        let hasSearched = false;

        function toggleVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Trình duyệt của bạn không hỗ trợ tìm kiếm bằng giọng nói.');
                return;
            }

            if (!recognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'vi-VN';
                recognition.interimResults = true;
                recognition.maxAlternatives = 1;

                recognition.onstart = () => {
                    isListening = true;
                    hasSearched = false;
                    document.getElementById('voiceOverlay').style.display = 'flex';
                    document.getElementById('voiceTranscript').textContent = '';
                };

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    let finalTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }

                    const currentText = finalTranscript || interimTranscript;
                    document.getElementById('voiceTranscript').textContent = currentText;
                    document.getElementById('searchInput').value = currentText;

                    if (finalTranscript && !hasSearched) {
                        hasSearched = true;
                        recognition.stop();
                        document.getElementById('voiceOverlay').style.display = 'none';
                        setTimeout(() => {
                            const defaultEng = localStorage.getItem('defaultEngine') || 'google';
                            performSearch(defaultEng);
                        }, 200);
                    }
                };

                recognition.onerror = (event) => {
                    console.error('Lỗi nhận diện giọng nói:', event.error);
                    document.getElementById('voiceOverlay').style.display = 'none';
                    isListening = false;
                };

                recognition.onend = () => {
                    isListening = false;
                    document.getElementById('voiceOverlay').style.display = 'none';
                    const query = document.getElementById('searchInput').value.trim();
                    if (query && !hasSearched) {
                        hasSearched = true;
                        setTimeout(() => {
                            const defaultEng = localStorage.getItem('defaultEngine') || 'google';
                            performSearch(defaultEng);
                        }, 200);
                    }
                };
            }

            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function closeVoiceSearch() {
            if (recognition) {
                recognition.stop();
            }
            isListening = false;
            document.getElementById('voiceOverlay').style.display = 'none';
        }

        function saveToHistory(query) {
            if (!query.trim()) return;
            let history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
            history = history.filter(item => item !== query);
            history.unshift(query);
            if (history.length > 5) history.pop();
            localStorage.setItem('searchHistory', JSON.stringify(history));
            renderHistory();
        }

        function removeHistoryItem(query) {
            let history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
            history = history.filter(item => item !== query);
            localStorage.setItem('searchHistory', JSON.stringify(history));
            renderHistory();
        }

        function clearAllHistory() {
            localStorage.removeItem('searchHistory');
            renderHistory();
        }

        function renderHistory() {
            const historyContainer = document.getElementById('historyContainer');
            const history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
            historyContainer.innerHTML = '';
            
            if (history.length === 0) return;

            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                
                const textSpan = document.createElement('span');
                textSpan.textContent = item;
                textSpan.onclick = () => {
                    document.getElementById('searchInput').value = item;
                    const defaultEng = localStorage.getItem('defaultEngine') || 'google';
                    performSearch(defaultEng);
                };
                
                const closeBtn = document.createElement('span');
                closeBtn.className = 'history-close';
                closeBtn.textContent = '×';
                closeBtn.title = 'Xóa mục này';
                closeBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeHistoryItem(item);
                };

                div.appendChild(textSpan);
                div.appendChild(closeBtn);
                historyContainer.appendChild(div);
            });

            const clearAllBtn = document.createElement('button');
            clearAllBtn.className = 'history-clear';
            clearAllBtn.textContent = 'Xóa tất cả ×';
            clearAllBtn.title = 'Xóa toàn bộ lịch sử';
            clearAllBtn.onclick = () => {
                clearAllHistory();
            };
            historyContainer.appendChild(clearAllBtn);
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('authPassword');
            const toggleBtn = document.getElementById('togglePassBtn');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        function handleGuestLogin() {
            localStorage.setItem('currentUser', 'Khách');
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('currentUsername').textContent = 'Khách';
        }

        function handleRegister() {
            const user = document.getElementById('authUsername').value.trim();
            const pass = document.getElementById('authPassword').value.trim();
            const errorDiv = document.getElementById('authError');

            if (!user || !pass) {
                errorDiv.textContent = 'Vui lòng nhập đầy đủ tên và mật khẩu!';
                errorDiv.style.display = 'block';
                return;
            }

            let users = JSON.parse(localStorage.getItem('users') || '{}');
            if (users[user]) {
                errorDiv.textContent = 'Tên tài khoản này đã tồn tại!';
                errorDiv.style.display = 'block';
                return;
            }

            users[user] = pass;
            localStorage.setItem('users', JSON.stringify(users));
            localStorage.setItem('currentUser', user);

            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('currentUsername').textContent = user;
        }

        function handleLogin() {
            const user = document.getElementById('authUsername').value.trim();
            const pass = document.getElementById('authPassword').value.trim();
            const errorDiv = document.getElementById('authError');

            if (!user || !pass) {
                errorDiv.textContent = 'Vui lòng nhập đầy đủ tên và mật khẩu!';
                errorDiv.style.display = 'block';
                return;
            }

            let users = JSON.parse(localStorage.getItem('users') || '{}');
            if (!users[user] || users[user] !== pass) {
                errorDiv.textContent = 'Sai tên tài khoản hoặc mật khẩu!';
                errorDiv.style.display = 'block';
                return;
            }

            localStorage.setItem('currentUser', user);

            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('currentUsername').textContent = user;
        }

        function logout() {
            localStorage.removeItem('currentUser');
            document.getElementById('authUsername').value = '';
            document.getElementById('authPassword').value = '';
            document.getElementById('authError').style.display = 'none';
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('authOverlay').style.display = 'flex';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeToggleBtn').textContent = isDark ? '☀️' : '🌙';
        }

        function performSearch(engineId) {
            const query = document.getElementById('searchInput').value.trim();
            let engines = getEngines();
            let engine = engines.find(e => e.id === engineId);
            if (!engine) return;

            if (query !== "") {
                saveToHistory(query);
            }

            let targetUrl = '';
            if (engine.type === 'builtin') {
                if (engine.id === 'gemini') {
                    targetUrl = 'https://gemini.google.com';
                } else if (engine.id === 'chatgpt') {
                    targetUrl = 'https://chatgpt.com';
                } else {
                    targetUrl = query === "" ? engine.url.split('?')[0] : engine.url + encodeURIComponent(query);
                }
            } else {
                targetUrl = query === "" ? engine.url : engine.url + encodeURIComponent(query);
            }

            if (targetUrl) {
                window.open(targetUrl, '_blank', 'noopener,noreferrer');
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                const defaultEng = localStorage.getItem('defaultEngine') || 'google';
                performSearch(defaultEng);
            }
        });
    </script>

</body>
</html>
