<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSearchVN</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Thư viện Kéo thả SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

    <!-- Thông tin người dùng -->
    <div class="user-info" id="userInfo" style="display: none;">
        <span>Xin chào, <b id="currentUsername">Khách</b></span>
        <button class="logout-btn" onclick="logout()">Đăng xuất</button>
    </div>

    <!-- Widget Đồng hồ & Thời tiết -->
    <div class="top-widget-bar">
        <div id="clockCalendarWidget">🕒 <b>00:00:00</b> | --/--/----</div>
        <div id="weatherWidget">🌤️ Đang tải...</div>
    </div>

    <!-- Nút Đổi giao diện (Toggle Switch) & Cài đặt -->
    <div style="position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; align-items: center; z-index: 10;">
        <!-- Toggle Switch Sáng/Tối -->
        <label class="switch" title="Đổi giao diện Sáng/Tối">
            <input type="checkbox" id="themeToggleCheckbox" onchange="toggleTheme()">
            <span class="slider">
                <span class="circle">
                    <svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="22" height="22" x="0" y="0" viewBox="0 0 32 32" style="enable-background:new 0 0 512 512" xml:space="preserve" class="sun">
                        <g>
                            <circle cx="16" cy="16" r="8.312" fill="currentColor" data-original="#000000"></circle>

                        </g>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 512 512" height="22" width="22" class="moon">
                        <g clip-path="url(#clip0_68_17)">
                            <path fill="currentColor" d="M355.2 142.08C355.2 162.133 338.773 178.56 318.72 178.56C298.667 178.56 282.453 162.133 282.453 142.08C282.453 122.027 298.667 105.813 318.72 105.813C338.773 105.813 355.2 122.027 355.2 142.08Z"></path>

.253 283.52C142.72 283.52 135.893 290.347 135.893 298.88C135.893 307.413 142.72 314.453 151.253 314.453C159.787 314.453 166.613 307.413 166.613 298.88C166.613 290.347 159.787 283.52 151.253 283.52Z"></path>
                        </g>
                        <defs>
                            <clipPath id="clip0_68_17">
                                <rect fill="currentColor" height="512" width="512"></rect>
                            </clipPath>
                        </defs>
                    </svg>
                </span>
            </span>
        </label>
        <!-- Nút Cài đặt -->
        <button class="button" onclick="toggleSettings()" title="Cài đặt">
            <svg
                class="svg-icon"
                fill="none"
                height="20"
                viewBox="0 0 20 20"
                width="20"
                xmlns="http://www.w3.org/2000/svg"
            >
                <g stroke="white" stroke-linecap="round" stroke-width="1.5">
                    <circle cx="10" cy="10" r="2.5"></circle>
                    <path
                        clip-rule="evenodd"
                        d="m8.39079 2.80235c.53842-1.51424 2.67991-1.51424 3.21831-.00001.3392.95358 1.4284 1.40477 2.3425.97027 1.4514-.68995 2.9657.82427 2.2758 2.27575-.4345.91407.0166 2.00334.9702 2.34248 1.5143.53842 1.5143 2.67996 0 3.21836-.9536.3391-1.4047 1.4284-.9702 2.3425.6899 1.4514-.8244 2.9656-2.2758 2.2757-.9141-.4345-2.0033.0167-2.3425.9703-.5384 1.5142-2.67989 1.5142-3.21831 0-.33914-.9536-1.4284-1.4048-2.34247-.9703-1.45148.6899-2.96571-.8243-2.27575-2.2757.43449-.9141-.01669-2.0034-.97028-2.3425-1.51422-.5384-1.51422-2.67994.00001-3.21836.95358-.33914 1.40476-1.42841.97027-2.34248-.68996-1.45148.82427-2.9657 2.27575-2.27575.91407.4345 2.00333-.01669 2.34247-.97026z"
                        fill-rule="evenodd"
                    ></path>
                </g>
            </svg>
            <span class="lable">Setting</span>
        </button>
    </div>

    <!-- Overlay Cài đặt -->
    <div class="auth-overlay" id="settingsOverlay" style="display: none;">
        <div class="auth-card" style="max-width: 480px; text-align: left;">
            <h2 style="margin-bottom: 15px; text-align: center;">⚙️ Tùy Chỉnh Cài Đặt</h2>
            
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px;">Công cụ tìm kiếm mặc định (Khi nhấn Enter):</label>
                <select id="defaultEngineSelect" onchange="changeDefaultEngine(event)" class="auth-input" style="margin-bottom: 0;">
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px;">Hình nền tùy chỉnh:</label>
                <input type="file" id="bgFileInput" accept="image/*" onchange="handleBgUpload(event)" style="display: none;">
                <button class="btn-register" style="width: 100%; padding: 8px; margin-bottom: 8px; cursor: pointer;" onclick="document.getElementById('bgFileInput').click()">🖼️ Tải ảnh lên từ máy</button>
                
                <div style="display: flex; gap: 6px; margin-bottom: 8px;">
                    <input type="text" id="bgUrlInput" placeholder="Hoặc dán URL hình nền vào đây..." class="auth-input" style="margin-bottom: 0; flex: 1; padding: 8px;">
                    <button class="btn-login" style="padding: 8px 12px; cursor: pointer; white-space: nowrap;" onclick="handleBgUrlApply()">Áp dụng</button>
                </div>
                
                <button class="logout-btn" style="width: 100%; text-align: center;" onclick="removeBgImage()">Xóa hình nền hiện tại</button>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px;">Thêm nút tìm kiếm / tiện ích mới:</label>
                <input type="text" id="customBtnName" placeholder="Tên nút (Ví dụ: Shopee)" class="auth-input" style="margin-bottom: 8px; padding: 8px;">
                <input type="text" id="customBtnUrl" placeholder="URL Tìm kiếm (Ví dụ: https://shopee.vn/search?keyword=)" class="auth-input" style="margin-bottom: 8px; padding: 8px;">
                <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 13px;">Màu sắc:</span>
                    <input type="color" id="customBtnColor" value="#1a0dab" style="border: none; background: none; cursor: pointer; width: 40px; height: 30px;">
                </div>
                <button class="btn-login" style="width: 100%; padding: 8px;" onclick="addSearchEngine()">+ Thêm Nút Tùy Chỉnh</button>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px;">Quản lý danh sách nút hiện tại:</label>
                <div id="enginesListContainer" style="max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; border: 1px solid #dfe1e5; padding: 8px; border-radius: 8px;">
                </div>
            </div>

            <div style="display: flex; gap: 10px; justify-content: space-between; margin-top: 15px;">
                <button class="logout-btn" onclick="factoryReset()">Khôi phục cài đặt gốc</button>
                <button class="btn-login" style="padding: 8px 20px;" onclick="toggleSettings()">Đóng</button>
            </div>
        </div>
    </div>

    <!-- Overlay Tìm kiếm Giọng nói -->
    <div class="auth-overlay" id="voiceOverlay" style="display: none;">
        <div class="auth-card" style="max-width: 350px;">
            <div style="font-size: 40px; margin-bottom: 10px; animation: pulse 1.5s infinite;">🎙️</div>
            <h3>Đang lắng nghe...</h3>
            <p id="voiceTranscript" style="margin: 15px 0; color: #5f6368; font-style: italic;">Hãy nói từ khóa bạn muốn tìm...</p>
            <button class="btn-guest" onclick="closeVoiceSearch()">Hủy</button>
        </div>
    </div>

    <!-- Overlay Xác thực Tài khoản -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <h2>Đăng Nhập / Đăng Ký</h2>
            <div class="auth-error" id="authError"></div>
            <input type="text" class="auth-input" id="authUsername" placeholder="Tên tài khoản">
            <div class="password-container">
                <input type="password" class="auth-input" id="authPassword" placeholder="Mật khẩu">
                <button class="toggle-password" id="togglePassBtn" onclick="togglePasswordVisibility()">👁️</button>
            </div>
            <div class="auth-buttons">
                <button class="auth-btn btn-login" onclick="handleLogin()">Đăng Nhập</button>
                <button class="auth-btn btn-register" onclick="handleRegister()">Đăng Ký</button>
            </div>
            <button class="btn-guest" onclick="handleGuestLogin()">Tiếp tục với tư cách Khách</button>
        </div>
    </div>

    <!-- Logo chính -->
    <h1 class="logo">
        <span class="logo-uni">UniSearch</span><span class="logo-vietnam">VN</span>
    </h1>

    <!-- Hộp tìm kiếm -->
    <div class="searchbar" id="searchBox">
        <div class="searchbar-wrapper">
            <div class="searchbar-left">
                <div class="search-icon-wrapper">
                    <span class="search-icon searchbar-icon" onclick="triggerDefaultSearch()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z">
                            </path>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="searchbar-center">
                <div class="searchbar-input-spacer"></div>
                <input type="text" class="searchbar-input" id="searchInput" maxlength="2048" name="q" autocapitalize="off" autocomplete="off" title="Search" role="combobox" placeholder="Nhập từ khóa tìm kiếm hoặc URL..." oninput="handleInputChange()">
            </div>

            <div class="searchbar-right">
                <button class="clear-btn searchbar-clear-icon" id="clearBtn" onclick="clearSearchInput()" style="display:none;">✕</button>
                <svg class="voice-search" role="button" onclick="toggleVoiceSearch()" title="Tìm kiếm bằng giọng nói" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path fill="#4285f4" d="m12 15c1.66 0 3-1.31 3-2.97v-7.02c0-1.66-1.34-3.01-3-3.01s-3 1.34-3 3.01v7.02c0 1.66 1.34 2.97 3 2.97z">
                    </path>
                    <path fill="#34a853" d="m11 18.08h2v3.92h-2z"></path>
                    <path fill="#fbbc05" d="m7.05 16.87c-1.27-1.33-2.05-2.83-2.05-4.87h2c0 1.45 0.56 2.42 1.47 3.38v0.32l-1.15 1.18z">
                    </path>
                    <path fill="#ea4335" d="m12 16.93a4.97 5.25 0 0 1 -3.54 -1.55l-1.41 1.49c1.26 1.34 3.02 2.13 4.95 2.13 3.87 0 6.99-2.92 6.99-7h-1.99c0 2.92-2.24 4.93-5 4.93z">
                    </path>
                </svg>
            </div>
        </div>
        <div class="suggestions-container" id="suggestionsContainer"></div>
    </div>

    <!-- Lịch sử tìm kiếm -->
    <div class="history-container" id="historyContainer"></div>

    <!-- Các nút tìm kiếm & Tiện ích -->
    <div class="search-buttons" id="searchButtonsContainer"></div>

    <!-- Workspace Ghi chú & Checklist -->
    <div id="notesWorkspace">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="color: #f59e0b; margin: 0;">📝 Workspace Ghi Chú & Checklist</h2>
            <button class="logout-btn" onclick="closeNotesWorkspace()">✕ Đóng</button>
        </div>
        
        <div style="margin-bottom: 15px;">
            <input type="text" id="wsNoteTitle" placeholder="Tiêu đề ghi chú/danh sách..." class="auth-input" style="margin-bottom: 8px; font-weight: bold;">
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                <input type="text" id="wsNewItemInput" placeholder="Nhập việc cần làm..." class="auth-input" style="margin-bottom: 0; flex: 1;" onkeypress="if(event.key==='Enter') addDraftChecklistItem()">
                <button class="btn-login" style="padding: 8px 15px; white-space: nowrap; background-color: #f59e0b; border-color: #f59e0b;" onclick="addDraftChecklistItem()">+ Thêm Mục</button>
            </div>
            
            <div id="wsDraftItemsContainer" style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;"></div>
            
            <button class="btn-login" style="width: 100%; padding: 10px; background-color: #f59e0b; border-color: #f59e0b;" onclick="saveWorkspaceNote()">💾 Lưu Ghi Chú / Checklist</button>
        </div>

        <hr style="border: none; border-top: 1px solid #dfe1e5; margin: 20px 0;">
        <h3 style="font-size: 16px; margin-bottom: 10px;">📋 Danh sách đã lưu:</h3>
        <div id="wsNotesListContainer" style="display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto;"></div>
    </div>

    <!-- Workspace Camera -->
    <div id="cameraWorkspace">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="color: #6366f1; margin: 0; font-size: 20px;">📷 Camera</h2>
            <button class="logout-btn" onclick="closeCameraWorkspace()">✕ Đóng</button>
        </div>

        <video id="camVideo" autoplay playsinline muted></video>
        <canvas id="camCanvas"></canvas>

        <select id="camFilterSelect" class="cam-select" onchange="applyCamFilter(this.value)">
            <option value="none">Bình thường</option>
            <option value="grayscale(100%)">Trắng đen</option>
            <option value="sepia(100%)">Cổ điển (Sepia)</option>
            <option value="invert(100%)">Đảo ngược màu</option>
            <option value="blur(4px)">Làm mờ</option>
            <option value="brightness(150%)">Tăng sáng</option>
        </select>

        <div style="display: flex; flex-direction: column; gap: 6px;">
            <button class="cam-btn btn-capture" onclick="captureCamImage()">📸 Chụp Ảnh</button>
            <button class="cam-btn btn-record" id="camRecordBtn" onclick="toggleCamRecord()">🎥 Bắt Đầu Quay Video</button>
            <button class="cam-btn btn-switch" onclick="switchCamFacing()">🔄 Đổi Camera (Trước/Sau)</button>
        </div>

        <div id="camResultArea" style="margin-top: 15px; display: none; text-align: left; border-top: 1px solid #dfe1e5; padding-top: 10px;">
            <h4 style="margin-bottom: 8px;">Kết quả mới nhất:</h4>
            <img id="camPhoto" style="display: none;">
            <a id="camDownloadPhoto" download="captured-photo.png" class="btn-login" style="display: none; text-align: center; text-decoration: none; margin-bottom: 10px; padding: 6px;">Tải Ảnh Về</a>

            <video id="camRecordedVideo" controls style="display: none;"></video>
            <a id="camDownloadVideo" download="recorded-video.webm" class="btn-login" style="display: none; text-align: center; text-decoration: none; padding: 6px;">Tải Video Về</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
