<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSearchVN - Tìm Kiếm Đa Năng</title>
    <!-- Thư viện SortableJS cho tính năng kéo thả nút -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <!-- Liên kết tệp CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="userInfo" class="user-info" style="display: none;">
        <span>Chào, <strong id="currentUsername"></strong></span>
        <button class="logout-btn" onclick="logout()">Đăng xuất</button>
    </div>

    <!-- Widget Đồng hồ & Thời tiết -->
    <div class="top-widget-bar">
        <div id="clockCalendarWidget">🕒 Đang tải thời gian...</div>
        <div id="weatherWidget">🌤️ Đang tải thời tiết...</div>
    </div>

    <!-- Hộp thoại Đăng nhập -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <h2>Đăng Nhập / Đăng Ký</h2>
            <div id="authError" class="auth-error"></div>
            <input type="text" id="authUsername" class="auth-input" placeholder="Nhập tên người dùng...">
            <div class="password-container">
                <input type="password" id="authPassword" class="auth-input" placeholder="Nhập mật khẩu...">
                <button type="button" id="togglePassBtn" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
            </div>
            <div class="auth-buttons">
                <button class="auth-btn btn-login" onclick="handleLogin()">Đăng Nhập</button>
                <button class="auth-btn btn-register" onclick="handleRegister()">Đăng Ký</button>
            </div>
            <button class="auth-btn btn-guest" onclick="handleGuestLogin()">Dùng tài khoản khách</button>
        </div>
    </div>

    <!-- Hộp thoại Giọng nói -->
    <div id="voiceOverlay" class="auth-overlay" style="display: none;">
        <div class="auth-card" style="max-width: 320px; text-align: center;">
            <div style="font-size: 40px; margin-bottom: 15px;">🎤</div>
            <h3 style="font-size: 18px; margin-bottom: 10px;">Tôi đang nghe đây!</h3>
            <p id="voiceTranscript" style="font-size: 14px; color: #5f6368; min-height: 20px; margin-bottom: 15px;"></p>
            <button class="btn" onclick="closeVoiceSearch()" style="width: 100%;">Thoát và tìm kiếm</button>
        </div>
    </div>

    <button id="themeToggleBtn" class="theme-toggle" onclick="toggleTheme()" title="Đổi giao diện">🌙</button>
    <button id="settingsToggleBtn" class="theme-toggle" style="right: 70px;" onclick="toggleSettings()" title="Cài đặt">⚙️</button>

    <!-- Modal Cài đặt -->
    <div id="settingsOverlay" class="auth-overlay" style="display: none;">
        <div class="auth-card" style="max-width: 450px; text-align: left; max-height: 90vh; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0; font-size: 20px;">Cài đặt hệ thống</h2>
                <button onclick="toggleSettings()" style="background: none; border: none; font-size: 18px; cursor: pointer; color: inherit;">✕</button>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px;">Hình nền:</label>
                <input type="file" id="bgImageInput" accept="image/*" class="auth-input" style="padding: 6px;" onchange="handleBgUpload(event)">
                <button class="btn" style="margin-top: 4px; width: 100%;" onclick="removeBgImage()">Xóa hình nền</button>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px;">Công cụ tìm kiếm mặc định (nhấn Enter):</label>
                <select id="defaultEngineSelect" class="auth-input" style="padding: 8px;" onchange="changeDefaultEngine(event)"></select>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px;">Thêm công cụ mới:</label>
                <input type="text" id="customBtnName" class="auth-input" placeholder="Tên công cụ..." style="margin-bottom: 6px;">
                <input type="text" id="customBtnUrl" class="auth-input" placeholder="Đường dẫn (https://...)..." style="margin-bottom: 6px;">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                    <label style="font-size: 13px;">Màu sắc:</label>
                    <input type="color" id="customBtnColor" value="#3c4043" style="border: none; width: 40px; height: 30px; cursor: pointer; background: none;">
                </div>
                <button class="btn btn-login" style="width: 100%;" onclick="addSearchEngine()">Thêm công cụ</button>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px;">Quản lý công cụ:</label>
                <div id="enginesListContainer" style="max-height: 100px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;"></div>
            </div>
            <div>
                <button class="btn" style="width: 100%; background-color: #EA4335; color: #fff; border-color: #EA4335;" onclick="factoryReset()">Khôi phục cài đặt gốc</button>
            </div>
        </div>
    </div>

    <!-- Logo chính -->
    <div class="logo">
        <span style="color:#4285F4;">U</span><span style="color:#EA4335;">n</span><span style="color:#FBBC05;">i</span><span style="color:#4285F4;">S</span><span style="color:#34A853;">e</span><span style="color:#EA4335;">a</span><span style="color:#4285F4;">r</span><span style="color:#34A853;">c</span><span style="color:#EA4335;">h</span><span style="color:#4285F4;">V</span><span style="color:#34A853;">N</span>
    </div>

    <!-- Hộp tìm kiếm -->
    <div class="search-box">
        <span class="search-icon" onclick="triggerDefaultSearch()" title="Tìm kiếm">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Nhập từ khóa tìm kiếm..." autofocus oninput="handleInputChange()" autocomplete="off">
        <button type="button" id="clearBtn" class="clear-btn" onclick="clearSearchInput()" title="Xóa">×</button>
        <button type="button" id="voiceBtn" class="voice-btn" onclick="toggleVoiceSearch()" title="Giọng nói">🎤</button>
        <div id="suggestionsContainer" class="suggestions-container"></div>
    </div>

    <!-- Lịch sử tìm kiếm -->
    <div id="historyContainer" class="history-container"></div>

    <!-- Các nút công cụ tìm kiếm -->
    <div class="search-buttons" id="searchButtonsContainer"></div>

    <!-- Workspace Ghi chú & Checklist -->
    <div id="notesWorkspace">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #dadce0; padding-bottom: 12px;">
            <h2 style="font-size: 20px;">📝 Ghi chú & Checklist</h2>
            <button class="btn" onclick="closeNotesWorkspace()" style="padding: 6px 14px; font-size: 13px;">← Quay lại</button>
        </div>
        <div style="margin-bottom: 20px;">
            <input type="text" id="wsNoteTitle" class="auth-input" placeholder="Tiêu đề ghi chú..." style="margin-bottom: 10px;">
            
            <!-- Khu vực thêm mục Checklist trực quan -->
            <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px;">Thêm việc cần làm:</label>
            <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                <input type="text" id="wsNewItemInput" class="auth-input" placeholder="Nhập việc cần làm rồi nhấn Thêm..." style="margin-bottom: 0;" onkeydown="if(event.key==='Enter'){addDraftChecklistItem();}">
                <button class="btn btn-login" style="white-space: nowrap; padding: 0 16px;" onclick="addDraftChecklistItem()">+ Thêm</button>
            </div>
            
            <!-- Danh sách nháp hiển thị rõ ràng -->
            <div id="wsDraftItemsContainer" style="margin-bottom: 15px; max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;"></div>

            <button class="btn btn-login" style="width: 100%; padding: 12px; border-radius: 8px; font-weight: bold;" onclick="saveWorkspaceNote()">💾 Lưu Toàn Bộ Ghi Chú</button>
        </div>
        <hr style="border: 0; border-top: 1px solid #dadce0; margin-bottom: 15px;">
        <h3 style="font-size: 15px; margin-bottom: 10px;">Ghi chú đã lưu:</h3>
        <div id="wsNotesListContainer" style="max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;"></div>
    </div>

    <!-- Workspace Camera -->
    <div id="cameraWorkspace">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="font-size: 20px; margin: 0;">📷 Camera & Bộ lọc</h2>
            <button class="btn" onclick="closeCameraWorkspace()" style="padding: 5px 10px; font-size: 12px;">✕ Đóng</button>
        </div>

        <video id="camVideo" autoplay playsinline muted></video>

        <select id="camFilterSelect" class="cam-select" onchange="applyCamFilter(this.value)">
            <option value="none">Bộ lọc: Bình thường</option>
            <option value="grayscale(100%)">Trắng đen (Grayscale)</option>
            <option value="sepia(100%)">Cổ điển (Sepia)</option>
            <option value="invert(100%)">Đảo màu (Invert)</option>
            <option value="contrast(200%)">Tương phản cao</option>
            <option value="hue-rotate(90deg)">Đổi sắc độ</option>
        </select>

        <button class="cam-btn btn-capture" onclick="captureCamImage()">Chụp Ảnh</button>
        <button class="cam-btn btn-record" id="camRecordBtn" onclick="toggleCamRecord()">Bắt Đầu Quay Video</button>
        <button class="cam-btn btn-switch" onclick="switchCamFacing()">Đổi Camera Trước/Sau</button>

        <div id="camResultArea" style="display: none; margin-top: 15px; border-top: 1px solid #ddd; padding-top: 12px; text-align: left;">
            <h3 style="font-size: 14px; margin-bottom: 6px;">Kết quả:</h3>
            <img id="camPhoto" alt="Ảnh chụp" style="display: none;">
            <a id="camDownloadPhoto" class="cam-btn btn-capture" style="display: none; text-decoration: none; text-align: center; margin-bottom: 8px;" download="anh-chup.png">Tải Ảnh Xuống</a>
            
            <video id="camRecordedVideo" controls style="display: none;"></video>
            <a id="camDownloadVideo" class="cam-btn btn-record" style="display: none; text-decoration: none; text-align: center;" download="video-quay.webm">Tải Video Xuống</a>
        </div>

        <canvas id="camCanvas"></canvas>
    </div>

    <!-- Liên kết tệp JavaScript -->
    <script src="script.js"></script>
</body>
</html>
